version: "1"
services:
  - type: web
    name: ottv2-game
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: DATABASE_URL
        fromDatabase:
          name: ottv2-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
databases:
  - name: ottv2-db
    plan: free
    region: singapore
    postgresMajorVersion: "18"
    databaseName: ottv2_db
    user: ottv2_db_user
